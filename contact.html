<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Contact Modern Business for inquiries about our digital services and solutions.">
  <title data-i18n="contactTitle">Contact | Modern Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/darkmode.css">
  <style>
    .header, .section { opacity: 0; transition: opacity 0.3s ease; }
    .header.loaded, .section.loaded { opacity: 1; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <header class="header" role="banner">
    <div class="container header__inner">
      <a href="/" class="logo bbh-bartle-regular" aria-label="Home">ModernBiz</a>
      <button class="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false">
        <span></span>
        <span></span>
        <span></span>
      </button>
      <nav class="nav" role="navigation">
        <button class="mobile-menu-close" aria-label="Close menu">&times;</button>
        <ul class="nav__list">
          <li><a href="/" class="nav__link">Home</a></li>
          <li><a href="/about.html" class="nav__link">About</a></li>
          <li><a href="services.html" class="nav__link">Services</a></li>
          <li><a href="/contact.html" class="nav__link active">Contact</a></li>
          <li><a href="/settings.html" class="nav__link">Settings</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <section class="section" aria-labelledby="contact-heading">
      <div class="container">
        <h1 id="contact-heading" class="bbh-bartle-regular" data-i18n="getInTouch">Get In Touch</h1>
        <form class="contact-form" novalidate>
          <div class="form-group">
            <label for="name" class="inter-medium" data-i18n="name">Name</label>
            <input type="text" id="name" name="name" class="inter-normal" required aria-required="true" aria-invalid="false">
            <span class="error-message inter-normal" id="name-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="email" class="inter-medium" data-i18n="email">Email</label>
            <input type="email" id="email" name="email" class="inter-normal" required aria-required="true" aria-invalid="false">
            <span class="error-message inter-normal" id="email-error" role="alert" aria-live="polite"></span>
          </div>
          <div class="form-group">
            <label for="message" class="inter-medium" data-i18n="message">Message</label>
            <textarea id="message" name="message" rows="5" class="inter-normal" required aria-required="true" aria-invalid="false"></textarea>
            <span class="error-message inter-normal" id="message-error" role="alert" aria-live="polite"></span>
          </div>
          <button type="submit" class="btn btn--primary inter-medium" data-i18n="send">Send Message</button>
          <div class="form-response inter-normal" id="form-response" role="alert" aria-live="polite"></div>
        </form>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="container footer-container">
      <p class="inter-normal">&copy; 2025 Modern Business. All rights reserved.</p>
      <div class="footer-links">
        <a href="/about.html" class="inter-medium">About</a>
        <a href="services.html" class="inter-medium">Services</a>
        <a href="/contact.html" class="inter-medium">Contact</a>
        <a href="/settings.html" class="inter-medium">Settings</a>
      </div>
    </div>
  </footer>

  <script src="/assets/js/main.js"></script>
  <script src="/assets/js/animations.js"></script>
  <script src="/assets/js/i18n.js"></script>
  <script src="/assets/js/contact-form.js"></script>
</body>
</html>
