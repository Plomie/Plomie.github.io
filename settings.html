<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta name="description" content="Manage your Modern Business account settings including appearance and language preferences.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' https://picsum.photos data:; connect-src 'self'">
  <title data-i18n="settingsTitle">Settings | Modern Business</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" as="style" onload="this.rel='stylesheet'">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" media="print" onload="this.media='all'">
  <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BBH+Bartle&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"></noscript>
  <link rel="stylesheet" href="/assets/css/variables.css">
  <link rel="stylesheet" href="/assets/css/base.css">
  <link rel="stylesheet" href="/assets/css/layout.css">
  <link rel="stylesheet" href="/assets/css/components.css">
  <link rel="stylesheet" href="/assets/css/darkmode.css">
  <style>
    .header, .section { opacity: 0; transition: opacity 0.3s ease; }
    .header.loaded, .section.loaded { opacity: 1; }
  </style>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>
  
  <site-header></site-header>

  <main id="main-content">
    <section class="section" aria-labelledby="settings-heading">
      <div class="container">
        <h1 id="settings-heading" class="bbh-bartle-regular" data-i18n="settings">Settings</h1>

        <div class="settings-group">
          <h2 class="bbh-bartle-regular" data-i18n="appearance">Appearance</h2>
          <div class="form-group toggle-group">
            <label for="dark-mode-toggle" class="inter-medium" data-i18n="darkMode">Dark Mode</label>
            <button id="dark-mode-toggle" class="toggle-btn" aria-pressed="false" aria-label="Toggle dark mode">
              <span class="toggle-track">
                <span class="toggle-thumb"></span>
              </span>
            </button>
          </div>
        </div>

        <div class="settings-group">
          <h2 class="bbh-bartle-regular" data-i18n="language">Language</h2>
          <div class="form-group">
            <label for="language-select" class="inter-medium" data-i18n="preferredLanguage">Preferred Language</label>
            <select id="language-select" class="language-select inter-normal">
              <option value="en">English</option>
              <option value="nl">Nederlands</option>
              <option value="fr">Français</option>
              <option value="de">Deutsch</option>
            </select>
          </div>
        </div>
      </div>
    </section>
  </main>

  <site-footer></site-footer>

  <script src="/assets/js/main.js" defer></script>
  <script src="/assets/js/animations.js" defer></script>
  <script src="/assets/js/i18n.js" defer></script>
  <script src="/assets/js/settings.js" defer></script>
</body>
</html>
